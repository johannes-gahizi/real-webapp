<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Passenger details</title><link rel="stylesheet" href="shared.css"></head>
<body data-page="search"><main class="auth-layout"><section class="card"><h1 class="page-title">Passenger details</h1><p class="page-intro">Confirm who is travelling before payment.</p><form id="booking-form" novalidate><div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><small class="field-error"></small></div><div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="078 123 4567" required><small class="field-error"></small></div><div class="form-actions"><button id="booking-button" type="submit">Continue to payment</button></div></form></section></main>
<script src="shared.js"></script><script>
const params=new URLSearchParams(location.search),busId=params.get('busId'),companyId=params.get('companyId'),form=document.querySelector('#booking-form'),button=document.querySelector('#booking-button');const validate=Gerayo.bindValidation(form,{name:'name',phone:'phone'},button);Gerayo.formatRwandaPhone(form.phone);
form.name.value=sessionStorage.getItem('passenger_name')||localStorage.getItem('userName')||'';
form.phone.value=sessionStorage.getItem('passenger_phone')||'';
form.name.addEventListener('input',e=>sessionStorage.setItem('passenger_name',e.target.value));
form.phone.addEventListener('input',e=>sessionStorage.setItem('passenger_phone',e.target.value));
form.addEventListener('submit',async e=>{e.preventDefault();if(!busId){Gerayo.showFeedback(form,'error','✕ This trip is missing its bus information. Please search again.');return;}if(!validate())return;Gerayo.setLoading(button,true,'Creating booking...');try{const res=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({busId,company_id:companyId,name:form.name.value.trim(),phone:form.phone.value})});const data=await res.json();if(!res.ok)throw data;Gerayo.showFeedback(form,'success','✓ Booking created! Continue to authorize your payment.');setTimeout(()=>location.href=`payment.html?bookingId=${data.bookingId}`,700);}catch(data){Gerayo.showFeedback(form,'error',Gerayo.apiMessage(data,'✕ Booking could not be completed.'));Gerayo.setLoading(button,false,'Continue to payment');}});
</script></body></html>
