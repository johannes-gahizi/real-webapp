<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Transport Partner</title><link rel="stylesheet" href="shared.css"></head>
<body data-page="partner" data-partner="true"><main class="auth-layout"><section class="card"><h1 class="page-title">Transport partner sign in</h1><p class="page-intro">Access your routes and passenger bookings.</p><form id="company-form" novalidate><div class="field"><label for="username">Corporate username</label><input id="username" name="username" autocomplete="username" required><small class="field-error"></small></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><small class="field-error"></small></div><div class="form-actions"><button id="login-button" type="submit">Sign in</button></div></form></section></main>
<script src="shared.js"></script><script>
if(localStorage.getItem('companyId'))location.href='admin.html';const form=document.querySelector('#company-form'),button=document.querySelector('#login-button');const validate=Gerayo.bindValidation(form,{username:'required',password:'required'},button);form.addEventListener('submit',async e=>{e.preventDefault();if(!validate())return;Gerayo.setLoading(button,true,'Verifying...');try{const res=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:form.username.value.trim(),password:form.password.value})}),data=await res.json();if(!res.ok)throw data;localStorage.setItem('companyId',data.token);localStorage.setItem('companyName',data.companyName);location.href='admin.html';}catch(data){Gerayo.showFeedback(form,'error',Gerayo.apiMessage(data,'✕ Unable to sign in. Please try again.'));Object.entries(data?.error?.fields||{}).forEach(([name,msg])=>Gerayo.setFieldError(form.elements[name],msg));Gerayo.setLoading(button,false,'Sign in');}});
</script></body></html>
