<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Sign in</title><link rel="stylesheet" href="shared.css"></head>
<body data-page="login"><main class="auth-layout"><section class="card"><h1 class="page-title">Welcome back</h1><p class="page-intro">Sign in to book your next trip.</p><form id="login-form" novalidate>
<div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="username" placeholder="you@example.com" required><small class="field-error"></small></div>
<div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><small class="field-error"></small></div>
<p class="field-help"><button class="button-secondary" type="button" id="forgot-toggle" style="padding:0;border:0">Forgot password?</button></p><div class="form-actions"><button id="login-button" type="submit">Sign in</button></div></form>
<form id="forgot-form" novalidate hidden><hr style="border:0;border-top:1px solid var(--border);margin:24px 0"><h2 style="font-size:1.1rem">Reset your password</h2><div class="field"><label for="reset-email">Email address</label><input id="reset-email" name="email" type="email" autocomplete="email" placeholder="you@example.com"><small class="field-error"></small></div><div class="form-actions"><button id="reset-button" type="submit">Send reset link</button></div></form><p class="page-intro" style="margin:20px 0 0;text-align:center">New to Gerayo? <a href="signup.html">Create an account</a></p></section></main>
<script src="shared.js"></script><script>
const loginForm=document.querySelector('#login-form'),loginButton=document.querySelector('#login-button'),forgotForm=document.querySelector('#forgot-form'),resetButton=document.querySelector('#reset-button');
const validateLogin=Gerayo.bindValidation(loginForm,{email:'email',password:'required'},loginButton);const validateReset=Gerayo.bindValidation(forgotForm,{email:'email'},resetButton);
document.querySelector('#forgot-toggle').onclick=()=>{forgotForm.hidden=!forgotForm.hidden;if(!forgotForm.hidden){forgotForm.email.value=loginForm.email.value.trim();forgotForm.email.focus();}};
loginForm.addEventListener('submit',async e=>{e.preventDefault();if(!validateLogin())return;Gerayo.clearFeedback(loginForm);Gerayo.setLoading(loginButton,true,'Signing in...');try{const res=await fetch('/api/user-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:loginForm.email.value.trim(),password:loginForm.password.value})});const data=await res.json();if(!res.ok)throw data;localStorage.setItem('userToken',data.token);localStorage.setItem('userName',data.userName);location.href='search.html';}catch(data){Gerayo.showFeedback(loginForm,'error',Gerayo.apiMessage(data,'Unable to sign in. Please try again.'));Object.entries(data?.error?.fields||{}).forEach(([name,msg])=>Gerayo.setFieldError(loginForm.elements[name],msg));Gerayo.setLoading(loginButton,false,'Sign in');}});
forgotForm.addEventListener('submit',async e=>{e.preventDefault();if(!validateReset())return;Gerayo.setLoading(resetButton,true,'Sending...');try{const res=await fetch('/api/user/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:forgotForm.email.value.trim()})});const data=await res.json();if(!res.ok)throw data;Gerayo.showFeedback(forgotForm,'success','✓ If an account exists, reset instructions have been sent.');}catch(data){Gerayo.showFeedback(forgotForm,'error',Gerayo.apiMessage(data,'Could not send reset instructions.'));}finally{Gerayo.setLoading(resetButton,false,'Send reset link');}});
</script></body></html>
