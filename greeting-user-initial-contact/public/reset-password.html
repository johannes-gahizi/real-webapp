<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Reset password</title><link rel="stylesheet" href="shared.css"></head>
<body data-page="login"><main class="auth-layout"><section class="card"><h1 class="page-title">Create a new password</h1><p class="page-intro">Use at least 8 characters to protect your account.</p><form id="reset-form" novalidate><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" required><small class="field-error"></small></div><div class="field"><label for="confirmPassword">Confirm password</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" required><small class="field-error"></small></div><div class="form-actions"><button id="save-button" type="submit">Save new password</button></div></form></section></main>
<script src="shared.js"></script><script>
const token=new URLSearchParams(location.search).get('token'),form=document.querySelector('#reset-form'),button=document.querySelector('#save-button');const validate=Gerayo.bindValidation(form,{password:'password',confirmPassword:value=>value===form.password.value?'':'Passwords do not match.'},button);
form.addEventListener('submit',async e=>{e.preventDefault();if(!token){Gerayo.showFeedback(form,'error','✕ This reset link is missing a token.');return;}if(!validate())return;Gerayo.setLoading(button,true,'Saving...');try{const res=await fetch('/api/user/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:form.password.value,confirmPassword:form.confirmPassword.value})});const data=await res.json();if(!res.ok)throw data;Gerayo.showFeedback(form,'success','✓ Password updated! You can now sign in.');setTimeout(()=>location.href='user-login.html',1200);}catch(data){Gerayo.showFeedback(form,'error',Gerayo.apiMessage(data,'Could not reset your password.'));Object.entries(data?.error?.fields||{}).forEach(([name,msg])=>Gerayo.setFieldError(form.elements[name],msg));Gerayo.setLoading(button,false,'Save new password');}});
</script></body></html>
