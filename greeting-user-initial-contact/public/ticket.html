<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Your ticket</title><link rel="stylesheet" href="shared.css"><style>.ticket{width:min(100%,390px);margin:auto;overflow:hidden;padding:0}.ticket-head{background:var(--primary);color:#fff;padding:22px;text-align:center}.ticket-body{padding:26px}.ticket-row{display:flex;justify-content:space-between;gap:16px;margin:0 0 20px}.ticket-row div:last-child{text-align:right}.ticket-label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.ticket-value{font-weight:700;color:var(--dark)}.ticket-qr{text-align:center;border-top:2px dashed var(--border);padding:24px}.ticket-qr img{display:block;width:160px;height:160px;margin:0 auto 16px}</style></head>
<body data-page="search"><main class="auth-layout"><section id="ticket" class="card ticket" hidden><div class="ticket-head"><strong id="company">Gerayo</strong></div><div class="ticket-body"><div class="ticket-row"><div><span class="ticket-label">Passenger</span><span class="ticket-value" id="passenger"></span></div><div><span class="ticket-label">Travel date</span><span class="ticket-value" id="date"></span></div></div><div class="ticket-row"><div><span class="ticket-label">From</span><span class="ticket-value" id="from"></span></div><div><span class="ticket-label">To</span><span class="ticket-value" id="to"></span></div></div><div class="ticket-row"><div><span class="ticket-label">Departure</span><span class="ticket-value" id="time"></span></div><div><span class="ticket-label">Seat</span><span class="ticket-value" id="seat"></span></div></div></div><div class="ticket-qr"><img id="qr" alt="Ticket QR code"><span class="ticket-label">Booking reference</span><strong id="reference"></strong><button class="button-secondary no-print" type="button" onclick="window.print()" style="display:block;width:100%;margin-top:20px">Print ticket</button></div></section><section id="error" class="card" hidden><h1 class="page-title">Ticket unavailable</h1><p class="page-intro" id="error-message"></p><a class="button" href="search.html">Search buses</a></section></main>
<script src="shared.js"></script><script>
const id=new URLSearchParams(location.search).get('id');function showError(message){document.querySelector('#error-message').textContent=message;document.querySelector('#error').hidden=false;}async function loadTicket(){if(!id){showError('✕ A ticket reference is required. Please search for a bus first.');return;}try{const res=await fetch(`/api/ticket/${encodeURIComponent(id)}`),data=await res.json();if(!res.ok)throw data;if(data.status!=='PAID'){showError('✕ Payment is still pending. Complete payment before viewing this ticket.');return;}document.querySelector('#company').textContent=data.company_name;document.querySelector('#passenger').textContent=data.passenger_name;document.querySelector('#date').textContent=new Date().toLocaleDateString('en-RW',{day:'numeric',month:'short',year:'numeric'});document.querySelector('#from').textContent=data.from_city;document.querySelector('#to').textContent=data.to_city;document.querySelector('#time').textContent=data.time;document.querySelector('#seat').textContent=data.seat_number||'Assigned at booking';document.querySelector('#reference').textContent=`GRY-${data.booking_id}`;document.querySelector('#qr').src=data.qr;document.querySelector('#ticket').hidden=false;}catch(data){showError(Gerayo.apiMessage(data,'✕ We could not find a ticket for this reference.'));}}loadTicket();
</script></body></html>
