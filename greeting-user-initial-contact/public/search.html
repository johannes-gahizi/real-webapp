<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Search trips</title><link rel="stylesheet" href="shared.css"></head>
<body data-page="search"><main><section class="card"><h1 class="page-title">Find your bus</h1><p class="page-intro">Choose your route to see available departures.</p><form id="search-form"><div class="field"><label for="from">From</label><select id="from" name="from"><option>Kigali</option><option>Musanze</option><option>Rubavu</option><option>Huye</option></select></div><div class="field"><label for="to">To</label><select id="to" name="to"><option>Musanze</option><option>Kigali</option><option>Rubavu</option><option>Huye</option></select></div><div class="form-actions"><button id="search-button" type="submit">Search buses</button></div></form></section>
<section id="results" aria-live="polite" style="margin-top:20px"></section>
<section id="booking" class="card" hidden style="margin-top:20px"><h2 style="margin-top:0">Passenger details</h2><p class="page-intro" id="selected-bus"></p><form id="booking-form" novalidate><div class="field"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required><small class="field-error"></small></div><div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="078 123 4567" required><small class="field-error"></small></div><div class="form-actions"><button id="booking-button" type="submit">Continue to payment</button></div></form></section></main>
<script src="shared.js"></script><script>
let selectedBus=null;const results=document.querySelector('#results'),searchForm=document.querySelector('#search-form'),searchButton=document.querySelector('#search-button'),booking=document.querySelector('#booking'),bookingForm=document.querySelector('#booking-form'),bookingButton=document.querySelector('#booking-button');const validateBooking=Gerayo.bindValidation(bookingForm,{name:'name',phone:'phone'},bookingButton);Gerayo.formatRwandaPhone(bookingForm.phone);
if(sessionStorage.getItem('search_from'))searchForm.from.value=sessionStorage.getItem('search_from');
if(sessionStorage.getItem('search_to'))searchForm.to.value=sessionStorage.getItem('search_to');
bookingForm.name.value=sessionStorage.getItem('passenger_name')||localStorage.getItem('userName')||'';
bookingForm.phone.value=sessionStorage.getItem('passenger_phone')||'';
searchForm.from.addEventListener('change',()=>sessionStorage.setItem('search_from',searchForm.from.value));
searchForm.to.addEventListener('change',()=>sessionStorage.setItem('search_to',searchForm.to.value));
bookingForm.name.addEventListener('input',e=>sessionStorage.setItem('passenger_name',e.target.value));
bookingForm.phone.addEventListener('input',e=>sessionStorage.setItem('passenger_phone',e.target.value));
searchForm.addEventListener('submit',async e=>{e.preventDefault();sessionStorage.setItem('search_from',searchForm.from.value);sessionStorage.setItem('search_to',searchForm.to.value);selectedBus=null;booking.hidden=true;results.innerHTML='<div class="card status-panel"><span class="spinner" aria-hidden="true"></span> Searching available buses…</div>';Gerayo.setLoading(searchButton,true,'Searching...');try{const res=await fetch(`/api/buses?from=${encodeURIComponent(searchForm.from.value)}&to=${encodeURIComponent(searchForm.to.value)}`);const data=await res.json();if(!res.ok)throw data;if(!Array.isArray(data)||!data.length){results.innerHTML='<div class="card status-panel">No buses are available for this route yet. Try another route.</div>';return;}results.replaceChildren(...data.map(bus=>createBusCard(bus)));}catch(data){results.innerHTML='';Gerayo.showFeedback(results,'error',Gerayo.apiMessage(data,'✕ We could not load buses right now. Please try again.'));}finally{Gerayo.setLoading(searchButton,false,'Search buses');}});
function createBusCard(bus){const card=document.createElement('article');card.className='result-card';const info=document.createElement('div'),title=document.createElement('strong'),meta=document.createElement('p'),action=document.createElement('div'),price=document.createElement('strong'),button=document.createElement('button');title.textContent=bus.company;meta.textContent=`${bus.from_city} → ${bus.to_city} · ${bus.time} · ${Math.max(0,Number(bus.seats_left)||0)} seats left`;price.textContent=`${Number(bus.price).toLocaleString()} RWF`;button.type='button';button.textContent='Select';button.disabled=Number(bus.seats_left)<=0;button.onclick=()=>selectBus(bus);info.append(title,meta);action.append(price,document.createElement('br'),button);card.append(info,action);return card;}
function selectBus(bus){selectedBus=bus;document.querySelector('#selected-bus').textContent=`${bus.company}: ${bus.from_city} → ${bus.to_city} at ${bus.time} · ${Number(bus.price).toLocaleString()} RWF`;booking.hidden=false;booking.scrollIntoView({behavior:'smooth',block:'start'});}
bookingForm.addEventListener('submit',async e=>{e.preventDefault();if(!selectedBus){Gerayo.showFeedback(booking,'error','✕ Select an available bus before continuing.');return;}if(!validateBooking())return;Gerayo.setLoading(bookingButton,true,'Creating booking...');try{const res=await fetch('/api/book',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({busId:selectedBus.id,company_id:selectedBus.company_id,name:bookingForm.name.value.trim(),phone:bookingForm.phone.value})});const data=await res.json();if(!res.ok)throw data;Gerayo.showFeedback(booking,'success','✓ Booking created! Continue to authorize your payment.');setTimeout(()=>location.href=`payment.html?bookingId=${data.bookingId}`,700);}catch(data){Gerayo.showFeedback(booking,'error',Gerayo.apiMessage(data,'✕ Booking could not be completed.'));Object.entries(data?.error?.fields||{}).forEach(([name,msg])=>Gerayo.setFieldError(bookingForm.elements[name],msg));Gerayo.setLoading(bookingButton,false,'Continue to payment');}});
</script></body></html>
