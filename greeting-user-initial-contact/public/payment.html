<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Gerayo | Payment</title><link rel="stylesheet" href="shared.css"><style>.amount{background:#f8fafc;border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;margin:20px 0}.amount strong{display:block;font-size:2rem;color:var(--primary);margin-top:5px}.payment-note{font-size:.85rem;color:var(--muted);text-align:center}</style></head>
<body data-page="search"><main class="auth-layout"><section class="card"><h1 class="page-title">Authorize payment</h1><p class="page-intro">Booking reference <strong id="reference">…</strong></p><div class="amount"><span>Amount due</span><strong id="price">Loading…</strong><span id="route" class="payment-note"></span></div><form id="payment-form" novalidate><div class="field"><label for="phone">Mobile Money number</label><input id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="078 123 4567" required><small class="field-error"></small></div><div class="form-actions"><button id="payment-button" type="submit">Authorize payment</button></div></form><p class="payment-note">You will receive a prompt on your phone. Payment is simulated in this MVP.</p></section></main>
<script src="shared.js"></script><script>
const bookingId=new URLSearchParams(location.search).get('bookingId'),form=document.querySelector('#payment-form'),button=document.querySelector('#payment-button');const validate=Gerayo.bindValidation(form,{phone:'phone'},button);Gerayo.formatRwandaPhone(form.phone);document.querySelector('#reference').textContent=bookingId?`#${bookingId}`:'Unavailable';
async function loadDetails(){if(!bookingId){Gerayo.showFeedback(form,'error','✕ A booking reference is required. Please start a new search.');button.disabled=true;return;}try{const res=await fetch(`/api/ticket/${encodeURIComponent(bookingId)}`),data=await res.json();if(!res.ok)throw data;document.querySelector('#price').textContent=`${Number(data.price).toLocaleString()} RWF`;document.querySelector('#route').textContent=`${data.from_city} → ${data.to_city} · ${data.time}`;}catch(data){document.querySelector('#price').textContent='Unavailable';Gerayo.showFeedback(form,'error',Gerayo.apiMessage(data,'✕ We could not load your booking.'));button.disabled=true;}}loadDetails();
form.addEventListener('submit',async e=>{e.preventDefault();if(!bookingId||!validate())return;Gerayo.setLoading(button,true,'Sending request...');Gerayo.showFeedback(form,'info','Payment request sent. Check your phone to authorize it.');try{const res=await fetch('/api/pay-request',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bookingId,phone:form.phone.value})}),data=await res.json();if(!res.ok)throw data;checkPaymentStatus();}catch(data){Gerayo.showFeedback(form,'error',Gerayo.apiMessage(data,'✕ Payment request could not be sent. Please try again.'));Gerayo.setLoading(button,false,'Authorize payment');}});
function checkPaymentStatus(){const interval=setInterval(async()=>{try{const res=await fetch(`/api/ticket/${encodeURIComponent(bookingId)}`),data=await res.json();if(!res.ok)throw data;if(data.payment_status==='PAID'){clearInterval(interval);Gerayo.showFeedback(form,'success','✓ Payment successful! Your ticket is ready.');setTimeout(()=>location.href=`ticket.html?id=${bookingId}`,1200);}else if(data.payment_status==='FAILED'||data.payment_status==='EXPIRED'){clearInterval(interval);Gerayo.showFeedback(form,'error',data.payment_status==='EXPIRED'?'✕ Payment timed out. Please try again.':'✕ Payment was not authorized. Check the number and try again.');Gerayo.setLoading(button,false,'Authorize payment');}}catch(data){clearInterval(interval);Gerayo.showFeedback(form,'error',Gerayo.apiMessage(data,'✕ We could not confirm the payment status.'));Gerayo.setLoading(button,false,'Authorize payment');}},2000);}
</script></body></html>
